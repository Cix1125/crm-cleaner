name: tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 项目零依赖，所以不需要 pip install 这一步
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test the CLI on the bundled examples
        run: |
          python -m crm_cleaner \
            -i examples/customers_a.csv examples/customers_b.csv \
            -r examples/rules.toml -o out || test $? -eq 1
          test -f out/master.csv
          test -f out/duplicates.html
          test -f out/changes.csv
